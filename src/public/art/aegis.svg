<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <style>
    .nucleus-aegis { animation: nucAegis 2.4s ease-in-out infinite; transform-origin: 150px 150px; }
    @keyframes nucAegis { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } }
    .orb-a1 { animation: orbA1 3.5s linear infinite; transform-origin: 150px 150px; }
    .orb-a2 { animation: orbA2 4.5s linear infinite reverse; transform-origin: 150px 150px; }
    .orb-a3 { animation: orbA3 5.5s linear infinite; transform-origin: 150px 150px; }
    @keyframes orbA1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbA2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbA3 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .nucleus-aegis, .orb-a1, .orb-a2, .orb-a3 { animation: none; }
    }
  </style>
  <!-- Nucleus (amber = seal keeper) -->
  <circle class="nucleus-aegis" cx="150" cy="150" r="13" fill="#ffae00"/>
  <circle cx="150" cy="150" r="21" fill="none" stroke="#ffae00" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="150" cy="150" r="29" fill="none" stroke="#ffae00" stroke-width="1" stroke-opacity="0.15"/>
  <text x="150" y="154" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#000">AE</text>
  <g class="orb-a1">
    <ellipse cx="150" cy="150" rx="118" ry="42" fill="none" stroke="#00ff41" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="32" cy="150" r="4.5" fill="#00ff41">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M 118 0 a 118 42 0 1 0 -236 0 a 118 42 0 1 0 236 0"/>
    </circle>
  </g>
  <g class="orb-a2" transform="rotate(60 150 150)">
    <ellipse cx="150" cy="150" rx="118" ry="42" fill="none" stroke="#00ff41" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="32" cy="150" r="4.5" fill="#00ff41">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 118 0 a 118 42 0 1 0 -236 0 a 118 42 0 1 0 236 0"/>
    </circle>
  </g>
  <g class="orb-a3" transform="rotate(120 150 150)">
    <ellipse cx="150" cy="150" rx="118" ry="42" fill="none" stroke="#00ff41" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="32" cy="150" r="4.5" fill="#00ff41">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M 118 0 a 118 42 0 1 0 -236 0 a 118 42 0 1 0 236 0"/>
    </circle>
  </g>
</svg>
