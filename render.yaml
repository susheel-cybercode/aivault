# VulnLab deployment on Render (free tier)
# Public lab — open access (no Basic Auth). VULNLAB_SAFE_MODE=1 keeps
# host-compromising RCE/SSRF/path-traversal sandboxed, but in-app vulns
# (SQLi, XSS, IDOR, etc.) are exploitable by design.
# To re-enable Basic Auth later, add VULNLAB_GATE_USER and VULNLAB_GATE_PASS.
services:
  - type: web
    name: owasp-vulnerable-lab
    env: node
    buildCommand: npm install
    startCommand: node src/app.js
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: VULNLAB_SAFE_MODE
        value: '1'
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
    autoDeploy: true
